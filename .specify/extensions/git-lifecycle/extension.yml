schema_version: "1.0"

extension:
  id: git-lifecycle
  name: "Git Lifecycle"
  version: "1.0.0"
  description: "Git operations at Spec Kit lifecycle points: prepare a clean working tree + feature branch before specifying, and checkpoint the feature's spec artifacts before implementation. Merged from the former git-specify-branch and git-commit extensions — renamed from id `git` (2026-07-27): spec-kit BUNDLES its own `git` extension, so `extension add git` resolves to the bundled one and ours could never install by that name — verified live during 003 US2 E2E."
  author: snackbyte
  license: MIT

requires:
  speckit_version: ">=0.13.0"

provides:
  commands:
    - name: speckit.git-lifecycle.specify-branch
      file: commands/speckit.git-lifecycle.specify-branch.md
      description: "Before /speckit-specify: ensure a clean working area and that the feature is on its own branch"
    - name: speckit.git-lifecycle.commit
      file: commands/speckit.git-lifecycle.commit.md
      description: "Commit the feature's Spec Kit artifacts as a checkpoint before implementation (also reused by close-out)"

hooks:
  before_specify:
    command: speckit.git-lifecycle.specify-branch
    optional: false
    prompt: "Clean the working area and switch to the feature branch before specifying?"
    description: "Ensure a clean working area and feature branch before specifying"
  before_implement:
    command: speckit.git-lifecycle.commit
    optional: false
    prompt: "Commit this feature's spec artifacts before implementing?"
    description: "Checkpoint the feature's spec artifacts before implementation"

tags:
  - "git"
  - "lifecycle"
